<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoVision Plant Extractor — Gemelo Digital & QRA (U044)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%200%22%20100%22%20100%22><text y=%22.9em%22 font-size=%2290%22>🏭</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="app.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Plotly JS para gráficos de Rosa de los Vientos y QRA -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    window.addEventListener('error', function(e) {
      console.error("Global JS Error:", e);
      var banner = document.getElementById('debug-error-banner');
      if (!banner && document.body) {
        banner = document.createElement('div');
        banner.id = 'debug-error-banner';
        banner.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;z-index:99999;background:#7f1d1d;color:#fee2e2;padding:12px 18px;border-radius:8px;border:2px solid #ef4444;font-family:monospace;font-size:12px;box-shadow:0 10px 25px rgba(0,0,0,0.5);';
        document.body.appendChild(banner);
      }
      if (banner) {
        banner.innerHTML = '<strong>⚠️ Error JS en Navegador:</strong> ' + (e.message || e.toString()) + 
          (e.filename ? ' <br><small>(' + e.filename + ':' + e.lineno + ')</small>' : '');
      }
    });
  </script>
</head>
<body>
  <div id="root">
    <div style="display: flex; height: 100vh; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: sans-serif;">
      <div style="font-size: 2.5rem; margin-bottom: 1rem;">🏭</div>
      <h2 style="font-size: 1.25rem; font-weight: 700; color: #38bdf8;">Cargando GeoVision U044 (React)...</h2>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem;">Inicializando Gemelo Digital, GIS GeoTIFF y Modelos QRA</p>
    </div>
  </div>
  <script type="text/babel" src="app_v3_final.js"></script>
</body>
</html>
